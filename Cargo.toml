[workspace]
members = [
    "crates/legion-core",
    "crates/legion-cli",
    "crates/legion-tui",
    "crates/legion-web",
    "crates/legion-ares",
]
resolver = "2"

[workspace.package]
version      = "1.1.35"
edition      = "2021"
# Enforced by cargo rather than only claimed in the README, which had drifted to
# "1.78" while the code uses `Option::is_none_or` (1.82) and
# `u64::is_multiple_of` (1.87) — a 1.78 toolchain cannot build this at all.
rust-version = "1.87"
authors      = ["Legion Contributors"]
license      = "MIT"
repository   = "https://github.com/Wraith-security/legion"
description  = "Legion SIEM/SOAR – package & IP security monitor"

[workspace.dependencies]
# async
tokio            = { version = "1",    features = ["full"] }
# HTTP – rustls so no system OpenSSL needed
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# serialization
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
# database (bundled SQLite – no external dep)
rusqlite         = { version = "0.40", features = ["bundled"] }
# datetime
chrono           = { version = "0.4",  features = ["serde"] }
# error handling
anyhow           = "1"
thiserror        = "1"
# logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# CLI
clap             = { version = "4",    features = ["derive", "color", "wrap_help", "env"] }
# TUI
ratatui          = "0.29"
crossterm        = "0.28"
# system info (cross-platform: Linux / Windows)
sysinfo          = "0.31"
# web server
axum             = "0.8"
tower-http       = { version = "0.5", features = ["cors"] }
tower            = { version = "0.4", features = ["util"] }
open             = "5"
# test helpers
tempfile         = "3"

# Release hardening (CIS 16). `overflow-checks` turns silent integer wraparound
# into a panic in release builds; strip/lto/codegen-units tune the output. The
# panic strategy is intentionally left at the default "unwind" so test and
# abort semantics are unchanged — a deliberate non-breaking choice.
[profile.release]
overflow-checks = true
strip           = "symbols"
lto             = "thin"
codegen-units   = 1
